version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: bugbaar_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    build: .
    container_name: bugbaar_api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Override the Redis URL from .env to connect to the local compose container
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: bugbaar_worker
    # Override the default CMD to run the worker process instead
    command: node -r tsconfig-paths/register dist/workers/index.js
    env_file:
      - .env
    environment:
      # Override the Redis URL from .env to connect to the local compose container
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
